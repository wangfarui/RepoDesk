name: RepoDesk
configs:
  Debug: debug
  Release: release
  Testing: debug
options:
  bundleIdPrefix: com.wangfarui
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  RepoDesk:
    type: application
    platform: macOS
    sources:
      - path: RepoDeskApp
      - path: LICENSE
        buildPhase: resources
      - path: Support/Resources/RepoDesk.icns
        buildPhase: resources
      - path: Support/Resources/MergeFonts
        type: folder
        buildPhase: resources
      - path: Support/ThirdParty
        type: folder
        buildPhase: resources
    prebuildScripts:
      - name: Prepare Java language runtime
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/bootstrap-java-language-runtime.sh"
          "${SRCROOT}/scripts/bootstrap-jar-decompiler.sh"
        basedOnDependencyAnalysis: false
    postbuildScripts:
      - name: Embed Java language runtime
        script: |
          set -euo pipefail
          runtime_dir="${SRCROOT}/build/JavaLanguageRuntime"
          destination_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/JavaLanguage"
          test -d "${runtime_dir}"
          rm -rf "${destination_dir}"
          ditto "${runtime_dir}" "${destination_dir}"
          decompiler_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/JarDecompiler"
          rm -rf "${decompiler_dir}"
          ditto "${SRCROOT}/build/JarDecompilerRuntime" "${decompiler_dir}"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangfarui.RepoDesk
        PRODUCT_NAME: RepoDesk
        ARCHS: "$(NATIVE_ARCH_ACTUAL)"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_CFBundleIconFile: RepoDesk.icns
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      configs:
        Testing:
          PRODUCT_BUNDLE_IDENTIFIER: com.wangfarui.RepoDesk.Testing
  RepoDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RepoDeskTests
    dependencies:
      - target: RepoDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RepoDeskUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: RepoDeskUITests
    dependencies:
      - target: RepoDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RepoDesk:
    build:
      targets:
        RepoDesk: all
        RepoDeskTests: [test]
        RepoDeskUITests: [test]
    test:
      config: Testing
      targets:
        - RepoDeskTests
        - RepoDeskUITests
  RepoDeskUIAcceptance:
    build:
      targets:
        RepoDesk: all
        RepoDeskUITests: [test]
    test:
      config: Testing
      targets:
        - RepoDeskUITests
